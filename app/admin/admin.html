<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sal-Kal admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231C2321'/%3E%3Cpath d='M9 22V14M16 22V9M23 22v-5' stroke='%23FFD23F' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/admin/admin.css">
<link rel="stylesheet" href="/admin/reports.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="/" title="Back to the shop">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" class="tile"/><path d="M9 22V14M16 22V9M23 22v-5" class="ink"/></svg>
    <span>Sal-Kal <b>admin</b></span>
  </a>
  <div class="controls">
    <div class="seg" role="radiogroup" aria-label="Period" id="range">
      <button type="button" role="radio" data-days="1">Today</button>
      <button type="button" role="radio" data-days="7">7 days</button>
      <button type="button" role="radio" data-days="30">30 days</button>
      <button type="button" role="radio" data-days="90">90 days</button>
    </div>
    <label class="switch"><input type="checkbox" id="mine"><span>Include my visits</span></label>
    <span class="live" id="live-pill" hidden><i></i><span></span></span>
    <button type="button" class="icon" id="refresh" aria-label="Refresh" title="Refresh">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3.2h-3.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>
<nav class="tabs" id="tabs" aria-label="Sections">
  <a href="#overview">Overview</a>
  <a href="#stuck">Where people get stuck</a>
  <a href="#usage">Usage</a>
  <a href="#audience">Audience</a>
  <a href="#users">Users</a>
  <a href="#server">Server</a>
  <a href="#data">Price data</a>
  <a href="#reports">Reports</a>
</nav>
<main id="main" aria-live="polite"></main>
<div class="tip" id="tip" role="tooltip" hidden></div>
<script src="/admin/admin.js"></script>
<script src="/admin/reports.js"></script>
</body>
</html>
